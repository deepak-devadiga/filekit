name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular application for GitHub Pages
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare artifact (404.html & .nojekyll)
        id: find_dist
        run: |
          INDEX_FILE=$(find dist -name "index.html" | head -n 1)
          if [ -z "$INDEX_FILE" ]; then
            echo "Error: index.html not found inside dist/"
            exit 1
          fi
          BUILD_DIR=$(dirname "$INDEX_FILE")
          echo "Found build output in: $BUILD_DIR"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          touch "$BUILD_DIR/.nojekyll"
          echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dist.outputs.build_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
